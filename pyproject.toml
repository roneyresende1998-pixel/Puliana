[project]
name = "pooliana"
version = "0.1.0"
description = "Puliana — agente DeFi para pools de liquidez em Solana (metodologia Genesis)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "solders>=0.21",
    "base58>=2.1",
]

[project.optional-dependencies]
voice = [
    "elevenlabs>=1.9",
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
